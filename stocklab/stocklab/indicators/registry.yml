# Pre-registered indicator thresholds — committed BEFORE use, per the
# project's pre-registration discipline. Edit = re-registration (git history
# is the audit trail). Crossings are research events, never trade signals.
#
# transform: level | yoy (percent change vs 1y ago) | yoy_diff (difference vs 1y ago)
# threshold rule language: "<var> <op> <number>" with var in {value, pctile}

indicators:

  # ---- LIVE NOW via auto-updated GitHub mirrors (network-policy-proof) -----
  # datahub core datasets refresh via upstream GitHub Actions and are served
  # from raw.githubusercontent.com — the one host the default policy allows.

  vix_level:
    registered_on: 2026-08-09
    source: github_csv
    series_id: https://raw.githubusercontent.com/datasets/finance-vix/main/data/vix-daily.csv
    date_col: DATE
    value_col: CLOSE
    description: CBOE VIX close (daily, current); vol regime of the whole market
    transform: level
    thresholds:
      elevated: "pctile > 0.8"
      triggered: "pctile > 0.95"

  us_cpi_yoy:
    registered_on: 2026-08-09
    source: github_csv
    series_id: https://raw.githubusercontent.com/datasets/s-and-p-500/main/data/data.csv
    date_col: Date
    value_col: Consumer Price Index
    zero_as_missing: true    # Shiller dataset pads recent derived columns with 0.0
    description: US CPI yoy (Shiller monthly, lags a few months); inflation regime
    transform: yoy
    thresholds:
      elevated: "value > 0.04"
      triggered: "value > 0.06"

  us10y_rate_monthly:
    registered_on: 2026-08-09
    source: github_csv
    series_id: https://raw.githubusercontent.com/datasets/s-and-p-500/main/data/data.csv
    date_col: Date
    value_col: Long Interest Rate
    zero_as_missing: true
    description: 10y rate (Shiller monthly mirror of the FRED series); rate-shock watch
    transform: yoy_diff
    thresholds:
      elevated: "value > 1.0"
      triggered: "value > 1.5"

  sp500_pe10:
    registered_on: 2026-08-09
    source: github_csv
    series_id: https://raw.githubusercontent.com/datasets/s-and-p-500/main/data/data.csv
    date_col: Date
    value_col: PE10
    zero_as_missing: true
    description: Shiller CAPE (PE10); valuation-stretch regime (context, not timing)
    transform: level
    thresholds:
      elevated: "pctile > 0.9"
      triggered: "pctile > 0.97"

  # ---- macro regime (the mechanical, non-forecast layer) -------------------
  us10y_yield:
    registered_on: 2026-08-08
    source: fred
    series_id: DGS10
    description: 10y Treasury yield; yoy_diff > +1.5pp = rate shock in progress
    transform: yoy_diff
    thresholds:
      elevated: "value > 1.0"
      triggered: "value > 1.5"

  yield_curve_10y2y:
    registered_on: 2026-08-08
    source: fred
    series_id: T10Y2Y
    description: 10y-2y curve; inversion (< 0) = classic late-cycle state
    transform: level
    thresholds:
      elevated: "value < 0.25"
      triggered: "value < 0"

  hy_credit_spread:
    registered_on: 2026-08-08
    source: fred
    series_id: BAMLH0A0HYM2
    description: ICE BofA HY OAS; stress regime when wide vs 5y history
    transform: level
    thresholds:
      elevated: "pctile > 0.8"
      triggered: "pctile > 0.95"

  breakeven_10y:
    registered_on: 2026-08-08
    source: fred
    series_id: T10YIE
    description: 10y breakeven inflation; yoy_diff moves = inflation repricing
    transform: yoy_diff
    thresholds:
      elevated: "value > 0.5"
      triggered: "value > 1.0"

  # ---- semiconductors field (the user's chosen chain) ----------------------
  semis_industrial_production:
    registered_on: 2026-08-08
    source: fred
    series_id: IPG3344S
    description: US industrial production, semiconductors & components; yoy contraction = downcycle
    transform: yoy
    thresholds:
      elevated: "value < 0.02"
      triggered: "value < 0"

  electronics_new_orders:
    registered_on: 2026-08-08
    source: fred
    series_id: A34SNO
    description: Manufacturers' new orders, computers & electronic products; yoy = demand cycle
    transform: yoy
    thresholds:
      elevated: "value < 0"
      triggered: "value < -0.05"

  semis_producer_prices:
    registered_on: 2026-08-08
    source: fred
    series_id: PCU33443344
    description: PPI, semiconductor & electronic component manufacturing; positive yoy = pricing power (shortage symptom)
    transform: yoy
    thresholds:
      # re-registered 2026-08-08 (audit F21): the series is structurally
      # deflationary (hedonic adjustment); the old absolute trigger (>3%)
      # would NOT have fired in the 2021-22 shortage it exists to catch.
      # Percentile rule self-calibrates to the deflationary base rate.
      elevated: "value > 0.01"
      triggered: "pctile > 0.95"
