[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stocklab"
version = "0.3.0"
description = "An honest machine-learning stock ranking laboratory (research/education only; not financial advice)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
deep = ["tensorflow-cpu>=2.15"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["stocklab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
